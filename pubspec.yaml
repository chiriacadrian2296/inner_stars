name: victory_stars
description: "Victory Stars: a personal growth app for recording the moments you got through."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  image: ^4.9.2
  share_plus: ^13.3.0
  tooltip_card: ^2.9.0
  audioplayers: ^6.5.1
  marionette_flutter: ^0.6.0
  hint_kit: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Local fork of hint_kit 1.3.0 (packages/hint_kit) — its scrim painter uses
# Path.combine(PathOperation.difference, ...) to cut the tour spotlight's
# hole, which silently fails to produce a visible cutout on Flutter Web
# (CanvasKit renderer) for a target inside a route pushed on top of the base
# one (e.g. a HintTarget inside a `showDialog` popup) — confirmed live, the
# computed hole rect itself was correct, only the paint step failed. The
# fork swaps that one call for saveLayer + BlendMode.clear, which doesn't
# rely on path boolean ops. Re-check pub.dev for a fix before dropping this.
#
# Local fork of tooltip_card 2.9.0 (packages/tooltip_card) —
# TooltipCardOverlayController.refresh() (called unconditionally from
# TooltipCard.didUpdateWidget whenever the tooltip is open, for *any* prop
# change) calls OverlayEntry.markNeedsBuild() unconditionally, which throws
# "setState() or markNeedsBuild() called during build" the moment that
# didUpdateWidget itself runs mid-build — hit live via the Sky's own
# tooltip, whose one-frame-later `updateData` nudge (see
# `_openTooltipDuringFlight` in sky_screen.dart) schedules exactly that
# rebuild. The fork defers the markNeedsBuild calls to a post-frame
# callback whenever they'd otherwise land mid-build. Re-check pub.dev for a
# fix before dropping this.
dependency_overrides:
  hint_kit:
    path: packages/hint_kit
  tooltip_card:
    path: packages/tooltip_card

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon_ring_centered.png
    - assets/icon/app_icon_ring_centered_white.png
    - assets/audio/bg/
    - assets/audio/sfx/
  shaders:
    - shaders/nebula_particles.frag
    - shaders/constellation_flare.frag
    - shaders/sky_decorations.frag
    - shaders/sky_wisps.frag
    - shaders/sky_black_hole.frag
    - shaders/sky_supernova.frag
    - shaders/menu_star_button.frag
  fonts:
    - family: Gloock
      fonts:
        - asset: assets/fonts/Gloock-Regular.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
        - asset: assets/fonts/InstrumentSans-Italic-Variable.ttf
          style: italic
    - family: Fragment Mono
      fonts:
        - asset: assets/fonts/FragmentMono-Regular.ttf

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#0D1220"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground_adaptive_ring.png"
  web:
    generate: true
    background_color: "#0D1220"
    theme_color: "#0D1220"
