name: Checks

# App checks run only when app code can have changed. Landing and security
# rules have their own path-filtered workflows, so a copy or colour change on
# the website never starts the full Flutter suite. Nothing here publishes.

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'landing/**'
      - 'docs/**'
      - 'tools/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.agents/**'
      - '.github/workflows/checks-landing.yml'
      - '.github/workflows/checks-rules.yml'
  pull_request:
    paths-ignore:
      - 'landing/**'
      - 'docs/**'
      - 'tools/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.agents/**'
      - '.github/workflows/checks-landing.yml'
      - '.github/workflows/checks-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (analyze and test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same Flutter version as the author's machine; bump it here and in
      # deploy-app-cloudflare.yml together.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
