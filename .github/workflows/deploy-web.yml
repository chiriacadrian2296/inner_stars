name: Deploy web

# Builds the Flutter web app and publishes it to GitHub Pages on every push
# to main — so sharing a link with someone (see the app's own README-less
# "share the web build with a friend" use case) always points at whatever
# is currently on main, with no manual build/publish step needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes an
# in-progress one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # The Pages site root is the Astro landing (landing/); the Flutter web
      # app lives under /app/. --base-href must match that subpath
      # (https://chiriacadrian2296.github.io/inner_stars/app/) — without it
      # the built app's asset/script paths 404.
      - run: flutter build web --release --base-href /inner_stars/app/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
      # Merge both builds into one Pages artifact.
      - run: cp -r build/web landing/dist/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
