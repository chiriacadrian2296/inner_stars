name: Security rules checks

# Firestore and Storage rules use their own emulator tests; changing them does
# not require compiling or testing the Flutter app or the landing.

on:
  push:
    branches-ignore: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tools/rules-tests/**'
      - '.github/workflows/checks-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tools/rules-tests/**'
      - '.github/workflows/checks-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Security rules (Firestore and Storage)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/rules-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/rules-tests/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Starts the Firestore and Storage emulators, runs the tests, and stops
      # the emulators again.
      - run: npm test
