<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icone essenziali — 24 px</title>
<style>body{background:#111521;color:#ece6d7;font:16px system-ui;padding:32px;margin:0}h1{font-size:24px}p{color:#aaa6a2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}article{background:#1b2030;border:1px solid #34394a;border-radius:16px;padding:20px}h2{font-size:17px;font-weight:500}.row{display:flex;gap:24px;margin:24px 0}.sample{display:flex;flex-direction:column;gap:12px;color:#aaa6a2;font-size:12px}.sample img{width:24px;height:24px;object-fit:contain}.chip{display:flex;align-items:center;gap:10px;color:#d6b574;border:1px solid #63553e;border-radius:24px;padding:10px 16px}.chip img{width:24px;height:24px;object-fit:contain}.large{width:140px;height:140px;object-fit:contain;display:block;margin:24px auto 0}a{color:#d6b574}</style>
<h1>Icone delle aree — versione essenziale</h1><p>Confronto alla dimensione reale di 24 px. Sotto ogni filtro trovi un ingrandimento della nuova proposta.</p><main class="grid" id="grid"></main>
<script>const areas=[['physical','Fisica'],['psychological','Psicologica'],['professional','Professionale'],['financial','Finanziaria'],['personal','Personale'],['social','Sociale'],['spiritual','Spirituale'],['philanthropic','Filantropica']];document.getElementById('grid').innerHTML=areas.map(([slug,title])=>`<article><h2>${title}</h2><div class="row"><span class="sample">Attuale<img src="../../assets/images/area_icons/${slug}.png" alt=""></span><span class="sample">Prova precedente<img src="${slug}-icon-v2.png" alt=""></span><span class="sample">Essenziale<img src="${slug}-icon-v3.png" alt=""></span></div><div class="chip"><img src="${slug}-icon-v3.png" alt="">${title}</div><a href="${slug}-icon-v3.png"><img class="large" src="${slug}-icon-v3.png" alt="Icona ${title}"></a></article>`).join('');</script></html>
