<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professionale e sociale — nuove prove</title>
<style>body{background:#111521;color:#ece6d7;font:16px system-ui;padding:32px;margin:0}h1{font-size:24px}.grid{display:flex;gap:24px;flex-wrap:wrap}article{background:#1b2030;border:1px solid #34394a;border-radius:16px;padding:24px;min-width:240px}h2{font-size:18px}.row{display:flex;gap:32px;margin:24px 0}.sample{display:flex;flex-direction:column;gap:12px;color:#aaa6a2;font-size:12px}.sample img{width:24px;height:24px;object-fit:contain}.chip{display:flex;align-items:center;gap:10px;color:#d6b574;border:1px solid #63553e;border-radius:24px;padding:10px 16px}.chip img{width:24px;height:24px;object-fit:contain}.large{width:180px;height:180px;object-fit:contain;display:block;margin:24px auto 0}</style>
<h1>Nuove proposte — confronto a 24 px</h1><main class="grid" id="grid"></main><script>document.getElementById('grid').innerHTML=[['professional','Professionale'],['social','Sociale']].map(([slug,title])=>`<article><h2>${title}</h2><div class="row"><span class="sample">Precedente<img src="${slug}-icon-v3.png" alt=""></span><span class="sample">Nuova<img src="${slug}-icon-v4.png" alt=""></span></div><div class="chip"><img src="${slug}-icon-v4.png" alt="">${title}</div><a href="${slug}-icon-v4.png"><img class="large" src="${slug}-icon-v4.png" alt="Icona ${title}"></a></article>`).join('');</script></html>
